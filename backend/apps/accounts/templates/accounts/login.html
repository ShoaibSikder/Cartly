<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in | Cartly</title></head>
<body>
  <main>
    <h1>Sign in</h1>
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.GET.next }}">
      {{ form.as_p }}
      <button type="submit">Sign in</button>
    </form>
    <p><a href="{% url 'accounts:register' %}">Create an account</a></p>
  </main>
</body>
</html>
