<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#2457c5">

<body data-page="orders">
  <main id="main-content" tabindex="-1">

      </table>
      <div class="empty-state" id="orders-empty" hidden><img src="../assets/empty-state.svg" alt="" width="128" height="96"><h2>You have not placed any orders yet</h2><p>Your orders will appear here after you check out.</p><a class="btn btn--primary" href="products.html">Browse products</a></div>
    </div>
