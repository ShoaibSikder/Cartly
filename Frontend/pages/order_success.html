<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2457c5">
  <title>Order placed | Cartly</title>
  
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css?v=cartly-product-images-20261021-1">
  <link rel="stylesheet" href="../css/components.css?v=cartly-product-images-20261021-1">
  <link rel="stylesheet" href="../css/pages.css?v=cartly-product-images-20261021-1">
  <link rel="stylesheet" href="../css/responsive.css?v=cartly-product-images-20261021-1">
</head>
<body data-page="order-success">
  <main id="main-content" tabindex="-1">
    <div class="container page">
      <section class="card card--pad-lg success-card" aria-labelledby="success-title">
        <div class="success-card__icon" aria-hidden="true">✓</div>
        <h1 id="success-title">Thank you, your order is placed</h1>
        <p class="text-muted">We’ll prepare your items and contact you about delivery.</p>
        <div class="order-ref"><span>Order reference</span><code id="success-order-reference"></code></div>
        <ul class="summary-items" id="success-order-items"></ul>
        <dl class="summary-rows"><div><dt>Payment</dt><dd id="success-payment"></dd></div><div class="total"><dt>Total due on delivery</dt><dd id="success-total"></dd></div></dl>
        <div class="success-card__actions"><a class="btn btn--primary" id="success-order-link" href="orders.html">View order details</a><a class="btn btn--secondary" href="products.html">Continue shopping</a></div>
      </section>
    </div>
  </main>
  <script type="module" src="../js/main.js?v=cartly-product-images-20261021-1"></script>
</body>
</html>
